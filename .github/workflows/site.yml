# Contenus Sanity, Studio et site sur GitHub Pages.
#
# - À chaque envoi sur la branche : migre les contenus dans Sanity sans rien écraser de ce
#   que l'équipe a modifié, publie le Studio, construit et publie le site.
# - Toutes les 15 minutes : reconstruit le site seulement si un contenu a été publié
#   dans le Studio depuis la dernière fois (ou si le jour a changé, pour l'agenda).
#
# Le jeton Sanity est lu dans les secrets du dépôt (SANITY_AUTH_TOKEN, ou l'un des
# autres noms courants ci-dessous). Il n'apparaît jamais dans les journaux.

name: Sanity et site

on:
  push:
    branches: [claude/awesome-mayer-7jwgvn]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publication]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-tbb
  cancel-in-progress: false

env:
  SANITY_PROJET: pgmabzq0
  SANITY_DATASET: production
  SITE_URL: https://wearebrothers-ch.github.io/Theatre-

jobs:
  sanity:
    name: Contenus et Studio Sanity
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN || secrets.SANITY_TOKEN || secrets.SANITY_API_TOKEN || secrets.SANITY_API_WRITE_TOKEN || secrets.SANITY_WRITE_TOKEN || secrets.SANITY_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vérifier le jeton
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::Aucun jeton Sanity dans les secrets du dépôt. Ajoutez-le sous le nom SANITY_AUTH_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "Jeton Sanity trouvé."

      # Contenus du site actuel (repris de Wix) : ce qui manque est créé, ce que l'équipe n'a
      # jamais retouché est mis à jour, ce qu'elle a modifié dans le Studio n'est jamais écrasé
      # (seuls les champs encore vides y sont ajoutés). Voir studio/scripts/migrer.mjs.
      - name: Migrer les contenus (sans rien écraser)
        working-directory: studio
        run: |
          node scripts/generer-amorce.mjs
          node scripts/migrer.mjs

      - name: Publier le Studio
        if: ${{ !cancelled() }}
        working-directory: studio
        env:
          SANITY_STUDIO_PREVIEW_URL: ${{ env.SITE_URL }}
          SANITY_STUDIO_APERCU: '0'
        run: npx sanity deploy --yes

  site:
    name: Construire le site
    needs: sanity
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      publier: ${{ steps.version.outputs.publier }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Contenus modifiés ?
        id: version
        run: |
          VERSION=$(node web/scripts/version-contenus.mjs)
          EN_LIGNE=$(curl -fsS "$SITE_URL/version.txt" 2>/dev/null || true)
          echo "Contenus : $VERSION"
          echo "En ligne : ${EN_LIGNE:-aucun}"
          echo "$VERSION" > version.txt
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$VERSION" = "$EN_LIGNE" ]; then
            echo "Rien de nouveau : le site en ligne est à jour."
            echo "publier=non" >> "$GITHUB_OUTPUT"
          else
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publier == 'oui'
        run: npm ci

      - if: steps.version.outputs.publier == 'oui'
        id: pages
        uses: actions/configure-pages@v5

      - name: Construire la version statique
        if: steps.version.outputs.publier == 'oui'
        env:
          TBB_STATIQUE: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node web/scripts/preparer-statique.mjs
          cp version.txt web/public/version.txt
          npm run build --workspace web

      - if: steps.version.outputs.publier == 'oui'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  prechauffer:
    name: Préparer les images sur le CDN
    needs: [site, publier]
    if: ${{ !cancelled() && needs.site.outputs.publier == 'oui' }}
    runs-on: ubuntu-latest
    steps:
      # Le CDN de Sanity fabrique chaque taille d'image à la première demande : on les
      # demande toutes maintenant (AVIF et WebP), pour que les visiteurs les reçoivent tout de suite.
      - name: Demander chaque image du site
        run: |
          curl -fsS "$SITE_URL/sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' > pages.txt
          echo "$(wc -l < pages.txt) pages"
          : > images.txt
          while read -r page; do
            curl -fsSL "$page" | grep -oE 'https://cdn\.sanity\.io/images/[^" ]+' | grep -v 'u0026' | grep -v '\\' | sed -e 's/&amp;/\&/g' -e 's/,$//' >> images.txt || true
          done < pages.txt
          sort -u images.txt -o images.txt
          echo "$(wc -l < images.txt) images"
          for format in "image/avif,image/webp,*/*" "image/webp,*/*"; do
            xargs -P 16 -I{} curl -s -o /dev/null -H "Accept: $format" "{}" < images.txt
          done
          echo "Images prêtes."

  publier:
    name: Publier sur GitHub Pages
    needs: site
    if: ${{ !cancelled() && needs.site.outputs.publier == 'oui' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
